<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="cave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262c3d"/>
      <stop offset="70%" stop-color="#151926"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>
    <radialGradient id="lava" cx="0.5" cy="1" r="0.8">
      <stop offset="0%" stop-color="#ffc107" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ff6f00" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#e65100" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e65100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="packA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    <linearGradient id="packB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#cave)"/>

  <!-- moria pillars in the dark -->
  <g fill="#1b2030">
    <rect x="26" y="0" width="50" height="336"/>
    <rect x="18" y="0" width="66" height="20"/>
    <rect x="524" y="0" width="50" height="336"/>
    <rect x="516" y="0" width="66" height="20"/>
    <rect x="250" y="0" width="26" height="150" opacity="0.6"/>
    <rect x="340" y="0" width="20" height="120" opacity="0.45"/>
  </g>

  <!-- the deep: fire glow rising from below -->
  <ellipse cx="300" cy="392" rx="260" ry="130" fill="url(#lava)"/>

  <!-- balrog lurking in the deep -->
  <g>
    <path d="M254 400 Q258 356 300 348 Q342 356 346 400 Z" fill="#150b05"/>
    <path d="M270 356 L252 326 L282 348 Z" fill="#150b05"/>
    <path d="M330 356 L348 326 L318 348 Z" fill="#150b05"/>
    <circle cx="287" cy="370" r="4.5" fill="#ffd54f"/>
    <circle cx="313" cy="370" r="4.5" fill="#ffd54f"/>
    <path d="M286 384 Q300 392 314 384 Q300 398 286 384 Z" fill="#ff8f00"/>
  </g>

  <!-- broken bridge ledges with jagged edges -->
  <path d="M0 332 H138 L150 352 L130 362 L144 400 H0 Z" fill="#333a4a"/>
  <path d="M0 330 H138 L142 344 H0 Z" fill="#5b647a"/>
  <path d="M600 332 H466 L452 352 L472 364 L458 400 H600 Z" fill="#333a4a"/>
  <path d="M600 330 H466 L462 344 H600 Z" fill="#5b647a"/>

  <!-- crumbling rubble tumbling into the chasm -->
  <g fill="#333a4a">
    <rect x="176" y="356" width="17" height="13" transform="rotate(20 184 362)"/>
    <rect x="412" y="374" width="13" height="11" transform="rotate(-26 418 379)"/>
    <rect x="286" y="392" width="10" height="9" transform="rotate(38 291 396)"/>
  </g>

  <!-- ARAGORN (Clint) — follow-through of the toss, on the left ledge -->
  <g>
    <!-- cloak sweeping behind -->
    <path d="M88 232 Q46 266 44 330 L92 330 Q86 276 104 240 Z" fill="#28402f"/>
    <!-- legs braced in a lunge -->
    <path d="M100 278 L74 330" stroke="#4e342e" stroke-width="13" stroke-linecap="round"/>
    <path d="M112 280 L138 328" stroke="#4e342e" stroke-width="13" stroke-linecap="round"/>
    <path d="M68 330 H90" stroke="#241610" stroke-width="9" stroke-linecap="round"/>
    <path d="M132 328 H154" stroke="#241610" stroke-width="9" stroke-linecap="round"/>
    <!-- torso + belt -->
    <path d="M90 230 H124 L128 282 H92 Z" fill="#5d7a4f"/>
    <path d="M90 246 H128" stroke="#8d6e63" stroke-width="6"/>
    <!-- shoulder mantle -->
    <path d="M86 232 Q106 220 128 232 Q106 244 86 232 Z" fill="#3f5c42"/>
    <!-- sheathed sword at the hip -->
    <path d="M96 262 L70 300" stroke="#8d6e63" stroke-width="6" stroke-linecap="round"/>
    <path d="M70 300 L62 312" stroke="#b0bec5" stroke-width="5" stroke-linecap="round"/>
    <!-- throwing arm, flung out after the release -->
    <path d="M124 244 Q158 232 186 220" stroke="#e6b98d" stroke-width="11" fill="none" stroke-linecap="round"/>
    <!-- other arm raised, pack held high -->
    <path d="M92 236 Q72 210 62 184" stroke="#e6b98d" stroke-width="11" fill="none" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="106" cy="212" r="16" fill="#e6b98d"/>
    <path d="M91 214 Q89 192 106 192 Q123 192 121 214 Q117 200 106 201 Q95 200 91 214 Z" fill="#3e2723"/>
    <path d="M91 210 Q87 226 93 234 Q96 222 95 212 Z" fill="#3e2723"/>
    <path d="M121 210 Q125 226 119 234 Q116 222 117 212 Z" fill="#3e2723"/>
    <circle cx="110" cy="212" r="1.8" fill="#2b1b12"/>
    <circle cx="101" cy="212" r="1.8" fill="#2b1b12"/>
    <path d="M98 220 Q106 226 114 220 Q112 230 106 230 Q100 230 98 220 Z" fill="#4e342e"/>
    <!-- his own prize pack, raised aloft -->
    <g transform="translate(44 138) rotate(-12)">
      <rect width="34" height="46" rx="5" fill="url(#packA)" stroke="#e65100" stroke-width="2"/>
      <circle cx="17" cy="17" r="9" fill="#ffffff" stroke="#e65100" stroke-width="2"/>
      <path d="M8 17 H26" stroke="#e65100" stroke-width="2"/>
      <circle cx="17" cy="17" r="2.6" fill="#ffffff" stroke="#e65100" stroke-width="2"/>
      <text x="17" y="36" font-size="7" font-family="Verdana, sans-serif" fill="#7a3e00" text-anchor="middle" font-weight="bold">PRIZE</text>
    </g>
  </g>

  <!-- flight streaks trailing the dwarf -->
  <g stroke="#7fd18a" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="196" y1="212" x2="242" y2="204"/>
    <line x1="188" y1="234" x2="234" y2="226"/>
    <line x1="204" y1="256" x2="244" y2="248"/>
  </g>

  <!-- GIMLI (Tony) — airborne over the chasm, a pack in each fist -->
  <g transform="translate(296 168) rotate(-14)">
    <!-- legs kicking out behind -->
    <path d="M2 56 L-32 76" stroke="#5d4037" stroke-width="14" stroke-linecap="round"/>
    <path d="M20 62 L-6 92" stroke="#5d4037" stroke-width="14" stroke-linecap="round"/>
    <path d="M-32 76 L-44 78" stroke="#241610" stroke-width="11" stroke-linecap="round"/>
    <path d="M-6 92 L-12 102" stroke="#241610" stroke-width="11" stroke-linecap="round"/>
    <!-- axe strapped across his back -->
    <g transform="translate(-6 34) rotate(-140)">
      <rect x="0" y="-3.5" width="48" height="7" rx="3.5" fill="#6d4c41"/>
      <path d="M36 -17 Q58 -9 58 0 Q58 9 36 17 Z" fill="#b0bec5" stroke="#78909c" stroke-width="2"/>
      <rect x="32" y="-17" width="7" height="34" rx="3" fill="#90a4ae"/>
    </g>
    <!-- chainmail body -->
    <ellipse cx="20" cy="40" rx="33" ry="26" fill="#78838f"/>
    <ellipse cx="20" cy="40" rx="33" ry="26" fill="none" stroke="#59616d" stroke-width="3"/>
    <!-- arms thrust forward, gripping the packs -->
    <path d="M40 26 Q68 14 88 10" stroke="#e6b98d" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M42 48 Q70 44 90 46" stroke="#e6b98d" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- great ginger beard -->
    <path d="M-2 0 Q-10 40 20 44 Q50 40 42 0 Z" fill="#d84315"/>
    <path d="M6 6 Q2 32 20 34 Q38 32 34 6 Z" fill="#f4511e"/>
    <!-- head -->
    <circle cx="20" cy="2" r="16" fill="#e6b98d"/>
    <circle cx="14" cy="0" r="2" fill="#2b1b12"/>
    <circle cx="27" cy="0" r="2" fill="#2b1b12"/>
    <path d="M8 -8 Q14 -12 18 -9" stroke="#8d3a10" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M23 -9 Q27 -12 33 -8" stroke="#8d3a10" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- iron helm -->
    <path d="M1 -10 Q4 -30 20 -30 Q36 -30 39 -10 Z" fill="#546e7a"/>
    <rect x="-1" y="-12" width="42" height="7" rx="3" fill="#455a64"/>
    <rect x="17" y="-10" width="6" height="14" rx="2" fill="#455a64"/>
    <!-- a pack in each fist -->
    <g transform="translate(82 -14) rotate(16)">
      <rect width="32" height="44" rx="5" fill="url(#packB)" stroke="#1b5e20" stroke-width="2"/>
      <circle cx="16" cy="16" r="8.5" fill="#ffffff" stroke="#1b5e20" stroke-width="2"/>
      <path d="M7.5 16 H24.5" stroke="#1b5e20" stroke-width="2"/>
      <circle cx="16" cy="16" r="2.5" fill="#ffffff" stroke="#1b5e20" stroke-width="2"/>
      <text x="16" y="34" font-size="6.5" font-family="Verdana, sans-serif" fill="#0b3d13" text-anchor="middle" font-weight="bold">PRIZE</text>
    </g>
    <g transform="translate(84 30) rotate(-8)">
      <rect width="32" height="44" rx="5" fill="url(#packA)" stroke="#e65100" stroke-width="2"/>
      <circle cx="16" cy="16" r="8.5" fill="#ffffff" stroke="#e65100" stroke-width="2"/>
      <path d="M7.5 16 H24.5" stroke="#e65100" stroke-width="2"/>
      <circle cx="16" cy="16" r="2.5" fill="#ffffff" stroke="#e65100" stroke-width="2"/>
      <text x="16" y="34" font-size="6.5" font-family="Verdana, sans-serif" fill="#7a3e00" text-anchor="middle" font-weight="bold">PRIZE</text>
    </g>
  </g>

  <!-- speech bubble -->
  <g>
    <path d="M336 22 H576 Q586 22 586 32 V72 Q586 82 576 82 H392 L372 102 L376 82 H336 Q326 82 326 72 V32 Q326 22 336 22 Z" fill="#ffffff" opacity="0.96"/>
    <text x="456" y="49" font-size="17" font-family="Verdana, sans-serif" fill="#1b5e20" text-anchor="middle" font-weight="bold">NOBODY TOSSES</text>
    <text x="456" y="70" font-size="17" font-family="Verdana, sans-serif" fill="#1b5e20" text-anchor="middle" font-weight="bold">A DWARF!</text>
  </g>

  <!-- green sparkles -->
  <g fill="#81c784">
    <circle cx="168" cy="126" r="4"/>
    <circle cx="486" cy="168" r="5"/>
    <circle cx="262" cy="112" r="3"/>
    <circle cx="430" cy="268" r="4"/>
    <circle cx="212" cy="296" r="3"/>
  </g>

  <!-- caption, tucked top-left so the chasm stays visible -->
  <g>
    <rect x="18" y="20" width="250" height="52" rx="10" fill="#0a0c12" opacity="0.6"/>
    <text x="34" y="42" font-size="15" font-family="Verdana, sans-serif" fill="#a5d6a7" font-weight="bold">DAY 212 · THE</text>
    <text x="34" y="62" font-size="15" font-family="Verdana, sans-serif" fill="#a5d6a7" font-weight="bold">FELLOWSHIP OF THE PACK</text>
  </g>
</svg>
